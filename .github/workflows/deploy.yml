name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_USER: ${{ secrets.SSH_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          rm .env

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enable Maintenance Mode
        run: ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "umask 002; cd $DEPLOY_PATH && php artisan down --retry=60 || true"

      - name: Sync Files
        run: |
          rsync -rlz --delete --no-perms --no-owner --no-group --chmod=D2775,F664 \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.devcontainer' \
            --exclude='node_modules' --exclude='tests' --exclude='testing' \
            --exclude='.env' --exclude='/storage' --exclude='database/*.sqlite*' \
            --exclude='/bootstrap/cache' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Migrate, Cache and Restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e
            umask 002
            cd $DEPLOY_PATH
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan optimize
            php artisan queue:restart
            php artisan up"
